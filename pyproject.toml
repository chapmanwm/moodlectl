[project]
name = "moodlectl"
version = "2.0.0"
description = "Unofficial CLI for University of Glasgow Moodle: mirror courses (files, folders, pages, assignments, announcements, grades) into a local, diffable corpus"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chapman Whitefield-Mathers" }]
requires-python = ">=3.10"
keywords = ["moodle", "university-of-glasgow", "uofg", "cli", "scraper", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = ["requests>=2.31.0", "beautifulsoup4>=4.12", "lxml>=5"]

[project.optional-dependencies]
office = ["python-pptx", "openpyxl", "python-docx", "pypdf>=4"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/chapmanwm/moodlectl"
Issues = "https://github.com/chapmanwm/moodlectl/issues"

[project.scripts]
moodlectl = "moodlectl.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
